apiVersion: v1
kind: Service
metadata: { name: mongodb, namespace: orderportal }
spec:
  clusterIP: None
  selector: { app: mongodb }
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongodb, namespace: orderportal }
spec:
  serviceName: mongodb
  replicas: 1
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
          readinessProbe: { tcpSocket: { port: 27017 }, initialDelaySeconds: 5, periodSeconds: 10 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
