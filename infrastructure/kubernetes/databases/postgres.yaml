apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: orderportal }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: orderportal }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: orderportal }
            - { name: POSTGRES_DB, value: orderportal_orders }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: orderportal-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U orderportal -d orderportal_orders"] }, initialDelaySeconds: 10, periodSeconds: 10 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
