{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "user-service",
    "namespace": "orderportal"
  },
  "spec": {
    "replicas": 2,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxUnavailable": 0,
        "maxSurge": 1
      }
    },
    "selector": {
      "matchLabels": {
        "app": "user-service"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "user-service"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "user-service",
            "image": "orderportal/user-service:local",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 4001
              },
              {
                "name": "grpc",
                "containerPort": 50051
              }
            ],
            "env": [
              {
                "name": "PORT",
                "value": "4001"
              },
              {
                "name": "JWT_SECRET",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "orderportal-secrets",
                    "key": "JWT_SECRET"
                  }
                }
              },
              {
                "name": "MONGO_URI",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "orderportal-secrets",
                    "key": "MONGO_URI"
                  }
                }
              },
              {
                "name": "GRPC_PORT",
                "value": "50051"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 4001
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 4001
              },
              "initialDelaySeconds": 20,
              "periodSeconds": 10
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            }
          }
        ]
      }
    }
  }
}