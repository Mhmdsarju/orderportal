name: OrderPortal CI/CD
on:
  push:
    branches: [main]
    paths: ['backend/**', 'infrastructure/kubernetes/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, user-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orderportal-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orderportal-${{ matrix.service }}:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
      - name: Create namespace and secrets
        run: |
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl -n orderportal create secret generic orderportal-secrets \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=MONGO_URI='${{ secrets.MONGO_URI }}' \
            --from-literal=DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply databases and wait until ready
        run: |
          kubectl apply -f infrastructure/kubernetes/databases/
          kubectl -n orderportal rollout status statefulset/mongodb --timeout=240s
          kubectl -n orderportal rollout status statefulset/postgres --timeout=240s
      - name: Apply application services and deployments
        run: |
          kubectl apply -f infrastructure/kubernetes/gateway/
          kubectl apply -f infrastructure/kubernetes/user-service/
          kubectl apply -f infrastructure/kubernetes/order-service/
      - name: Update image tags
        run: |
          for service in gateway user-service order-service; do
            kubectl -n orderportal set image deployment/$service $service=${{ secrets.DOCKERHUB_USERNAME }}/orderportal-$service:${{ github.sha }}
          done
      - name: Wait for rollouts
        run: |
          kubectl -n orderportal rollout status deployment/gateway --timeout=180s
          kubectl -n orderportal rollout status deployment/user-service --timeout=180s
          kubectl -n orderportal rollout status deployment/order-service --timeout=180s
      - name: Roll back application deployments on failure
        if: failure()
        run: |
          kubectl -n orderportal rollout undo deployment/gateway || true
          kubectl -n orderportal rollout undo deployment/user-service || true
          kubectl -n orderportal rollout undo deployment/order-service || true
