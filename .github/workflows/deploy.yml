
name: OrderPortal CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infrastructure/kubernetes/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orderportal-deployment
  cancel-in-progress: false

jobs:

  # 1. BUILD AND PUSH DOCKER IMAGE
  

  build-and-push:

    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: gateway
            context: ./backend/api-gateway

          - service: user-service
            context: ./backend/user-service

          - service: order-service
            context: ./backend/order-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub credentials are missing."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orderportal-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orderportal-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          
  # 2. DEPLOY TO KUBERNETE
  

  deploy:

    name: Deploy to Kubernetes

    runs-on: ubuntu-latest

    needs: build-and-push

    environment: production

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure kubectl

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl version --client

          kubectl cluster-info

      # Validate required secrets

      - name: Validate deployment secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          for variable in JWT_SECRET MONGO_URI DATABASE_URL POSTGRES_PASSWORD DOCKERHUB_USERNAME; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required secret: $variable"
              exit 1
            fi
          done

          echo "Required deployment secrets are available."

      # Create namespace

      - name: Create Kubernetes namespace
        run: |
          set -euo pipefail

          kubectl apply -f infrastructure/kubernetes/namespace.yaml

      # Create or update Kubernetes secrets

      - name: Create or update application secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          kubectl -n orderportal create secret generic orderportal-secrets \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MONGO_URI="$MONGO_URI" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Deploy databases

      - name: Deploy MongoDB and PostgreSQL
        run: |
          set -euo pipefail

          kubectl apply -f infrastructure/kubernetes/databases/

      - name: Wait for database readiness
        run: |
          set -euo pipefail

          kubectl -n orderportal rollout status statefulset/mongodb \
            --timeout=240s

          kubectl -n orderportal rollout status statefulset/postgres \
            --timeout=240s

      # Deploy application services

      - name: Deploy application resources
        run: |
          set -euo pipefail

          kubectl apply -f infrastructure/kubernetes/gateway/

          kubectl apply -f infrastructure/kubernetes/user-service/

          kubectl apply -f infrastructure/kubernetes/order-service/

      # Update Docker images

      - name: Update application image versions
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          kubectl -n orderportal set image \
            deployment/gateway \
            gateway="$DOCKERHUB_USERNAME/orderportal-gateway:$IMAGE_TAG"

          kubectl -n orderportal set image \
            deployment/user-service \
            user-service="$DOCKERHUB_USERNAME/orderportal-user-service:$IMAGE_TAG"

          kubectl -n orderportal set image \
            deployment/order-service \
            order-service="$DOCKERHUB_USERNAME/orderportal-order-service:$IMAGE_TAG"

      # Verify deployments

      - name: Verify Kubernetes rollouts
        run: |
          set -euo pipefail

          kubectl -n orderportal rollout status deployment/gateway \
            --timeout=180s

          kubectl -n orderportal rollout status deployment/user-service \
            --timeout=180s

          kubectl -n orderportal rollout status deployment/order-service \
            --timeout=180s

      - name: Verify running pods
        run: |
          set -euo pipefail

          kubectl -n orderportal get deployments

          kubectl -n orderportal get pods

          kubectl -n orderportal get services

      # Deployment diagnostics

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl -n orderportal get pods -o wide || true

          kubectl -n orderportal get deployments || true

          kubectl -n orderportal get events \
            --sort-by=.metadata.creationTimestamp || true

      # Rollback on deployment failure

      - name: Rollback application deployments
        if: failure()
        run: |
          kubectl -n orderportal rollout undo deployment/gateway || true

          kubectl -n orderportal rollout undo deployment/user-service || true

          kubectl -n orderportal rollout undo deployment/order-service || true
